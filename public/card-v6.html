<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<title>M44 — 声音解剖报告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #faf7f1; --paper-2: #f1ece2; --ink: #17130d; --ink-2: #4d4639;
  --ink-3: #8a8172; --line: #ddd5c4; --line-soft: #e9e3d5;
  --accent: #c41e3a; --accent-deep: #9d1530; --gold: #b08d3e;
  --night: #12100c; --night-2: #1c1813;
  --f-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  --f-sans: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--night)}
body{
  min-height:100vh;color:var(--ink);font:16px/1.7 var(--f-serif);
  background:radial-gradient(1200px 500px at 50% -10%, rgba(196,30,58,.08), transparent 60%), var(--night);
  display:flex;flex-direction:column;align-items:center;
  padding:28px 16px 40px;
}
.stage-wrap{width:750px;max-width:100%}
.stage{transform-origin:top center;position:relative}
.pages{position:relative}
.page{
  width:750px;background:var(--paper);position:absolute;top:0;left:0;overflow:hidden;
  opacity:0;pointer-events:none;z-index:1;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4);
}
.page.active{position:relative;opacity:1;pointer-events:auto;z-index:2;
  animation:pageIn .55s cubic-bezier(.22,1,.36,1) both}
.page.active.locked{animation:none}
@keyframes pageIn{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* Shared */
.cover-tint{position:absolute;inset:-30px;background-size:cover;background-position:center;
  filter:grayscale(100%) blur(26px) brightness(1.07);opacity:.16;pointer-events:none}
.frame-line{position:absolute;inset:14px;border:1px solid var(--line);pointer-events:none;z-index:3}
.corner{position:absolute;width:14px;height:14px;z-index:4;pointer-events:none}
.corner.tl{top:8px;left:8px;border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.corner.tr{top:8px;right:8px;border-top:2px solid var(--ink);border-right:2px solid var(--ink)}
.corner.bl{bottom:8px;left:8px;border-bottom:2px solid var(--ink);border-left:2px solid var(--ink)}
.corner.br{bottom:8px;right:8px;border-bottom:2px solid var(--ink);border-right:2px solid var(--ink)}
.chip{display:inline-block;font:13px var(--f-mono);letter-spacing:1px;border:1px solid currentColor;
  padding:5px 14px;border-radius:99px;opacity:.78}
.thumbbox{border:1px solid var(--line);overflow:hidden;background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.thumbbox img{width:100%;height:100%;object-fit:cover}
.thumbbox.noart{background:var(--line-soft)}
.thumb-letter{font:inherit;font-weight:700;color:var(--ink-3);user-select:none}

/* ========== P1 Cover ========== */
.p-cover{height:750px;background:var(--night-2);color:#f3eee2;display:flex;flex-direction:column}
.p-cover .glow{position:absolute;inset:0;background:
  radial-gradient(700px 500px at 85% 8%, hsla(var(--hue,352),55%,30%,.40), transparent 60%),
  radial-gradient(600px 600px at 8% 95%, hsla(var(--hue,352),60%,20%,.5), transparent 65%)}
.p-cover .inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:20px 48px 14px}
.cover-top{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:1px solid rgba(243,238,226,.22);padding-bottom:14px}
.cover-top .brand{font:700 15px var(--f-mono);letter-spacing:6px}
.cover-top .brand b{color:var(--accent);font-weight:400}
.cover-top .date{font:10px var(--f-mono);letter-spacing:2px;color:rgba(243,238,226,.6);text-align:right;line-height:1.9}
.sleeve-zone{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0 2px;min-height:0}
.sleeve{width:188px;height:188px;position:relative;background-size:cover;background-position:center;
  border:1px solid rgba(243,238,226,.28);
  box-shadow:0 36px 80px -16px rgba(0,0,0,.85), 0 0 0 8px rgba(243,238,226,.05);
  animation:sleeveIn 1s cubic-bezier(.22,1,.36,1) both}
@keyframes sleeveIn{from{opacity:0;transform:translateY(30px) rotate(-2deg) scale(.96)}to{opacity:1;transform:none}}
.sleeve.noart{display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg, hsla(var(--hue,352),50%,26%,1), hsla(var(--hue,352),60%,14%,1))}
.sleeve.noart span{font:900 100px/1 var(--f-serif);color:rgba(243,238,226,.9)}
.sleeve::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg, rgba(255,255,255,.14) 0%, transparent 28%)}
.cover-info{text-align:center;animation:riseIn .8s .25s both}
.c-artist{font:13px var(--f-mono);letter-spacing:7px;text-transform:uppercase;color:rgba(243,238,226,.85)}
.c-title{font:900 38px/1.2 var(--f-serif);letter-spacing:0;margin-top:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{font:11px var(--f-mono);letter-spacing:2px;color:rgba(243,238,226,.62);margin-top:12px}
.c-score-band{display:flex;align-items:center;justify-content:center;gap:30px;margin-top:10px;
  padding-top:10px;border-top:1px solid rgba(243,238,226,.22);animation:riseIn .8s .45s both}
.c-total{display:flex;align-items:baseline;gap:8px}
.c-total .num{font:900 74px/0.95 var(--f-serif);color:var(--accent);letter-spacing:-3px}
.c-total .of{font:11px var(--f-mono);letter-spacing:2px;color:rgba(243,238,226,.6);line-height:1.8;text-align:left}
.c-heat{font:20px var(--f-mono);color:var(--gold);letter-spacing:3px;text-align:left;line-height:1.4}
.c-heat small{display:block;font:9px var(--f-mono);letter-spacing:3px;color:rgba(243,238,226,.55)}
.c-oneliner{margin-top:8px;font:600 18px/1.4 var(--f-serif);color:#f3eee2;animation:riseIn .8s .6s both;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.c-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;color:rgba(243,238,226,.85);
  animation:riseIn .8s .7s both}
.c-summary{margin:8px 38px 0;font:13px/1.9 var(--f-serif);color:rgba(243,238,226,.62);text-align:center;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* ========== P2 Verified Data (dark, objective) ========== */
.p-data{height:750px;background:var(--night-2);color:#f3eee2;display:flex;flex-direction:column}
.p-data .glow{position:absolute;inset:0;background:
  radial-gradient(700px 480px at 88% 4%, hsla(var(--hue,352),52%,26%,.34), transparent 60%),
  radial-gradient(560px 520px at 6% 96%, hsla(var(--hue,352),55%,16%,.45), transparent 65%)}
.p-data .inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;min-height:0}
.data-head{display:flex;align-items:center;gap:18px;padding:20px 44px 14px;border-bottom:1px solid rgba(243,238,226,.18)}
.data-head .thumbbox{width:76px;height:76px;font-size:24px;border-color:rgba(243,238,226,.22)}
.data-head .who{flex:1;min-width:0}
.data-head .who .a{font:12px var(--f-mono);letter-spacing:4px;text-transform:uppercase;color:rgba(243,238,226,.72)}
.data-head .who .t{font:700 27px/1.25 var(--f-sans);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.data-head .who .m{font:11px var(--f-mono);letter-spacing:1px;color:rgba(243,238,226,.55);margin-top:3px}
.data-head .tot{text-align:right}
.data-head .tot .n{font:900 46px/1 var(--f-serif);color:var(--accent)}
.data-head .tot .n em{font:12px var(--f-mono);font-style:normal;color:rgba(243,238,226,.6)}
.data-head .tot .l{font:10px var(--f-mono);letter-spacing:3px;color:rgba(243,238,226,.55)}
.data-body{flex:1;display:flex;flex-direction:column;padding:12px 44px 4px;min-height:0;overflow:hidden}
.data-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 18px}
.data-cell{display:flex;flex-direction:column;border-bottom:1px solid rgba(243,238,226,.12);padding:4px 0 3px}
.data-cell .k{font:9px var(--f-mono);letter-spacing:2px;color:rgba(243,238,226,.5);text-transform:uppercase}
.data-cell .v{font:600 16px/1.3 var(--f-serif);color:#f3eee2;margin-top:2px}
.data-cell .s{font:9px var(--f-mono);color:rgba(243,238,226,.42);margin-top:1px}
.data-heat{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.data-heat .hcard{display:flex;flex-direction:column;align-items:center;text-align:center;border:1px solid rgba(243,238,226,.2);border-radius:8px;padding:8px 14px}
.data-heat .hcard .hk{font:9px var(--f-mono);letter-spacing:2px;color:rgba(243,238,226,.55)}
.data-heat .hcard .hv{font:700 20px var(--f-mono);color:var(--gold);margin-top:4px;letter-spacing:2px}
.data-heat .hcard .hd{font:10px/1.6 var(--f-mono);color:rgba(243,238,226,.55);margin-top:3px}
.data-block{margin-top:8px}
.data-block-title{font:9px var(--f-mono);letter-spacing:3px;color:rgba(201,162,77,.8);margin-bottom:2px}
.data-sub{font:9px var(--f-mono);letter-spacing:2px;color:rgba(243,238,226,.45);margin:3px 0 1px}
.drow{display:flex;align-items:baseline;gap:10px;font:10px/1.55 var(--f-serif);color:rgba(243,238,226,.78)}
.drow .dk{flex:1;min-width:0}
.drow .dm{flex:1.2;min-width:0;color:rgba(243,238,226,.55)}
.drow .dv{font:10px var(--f-mono);color:var(--gold);white-space:nowrap}
.data-credits{margin-top:8px;font:10px/1.6 var(--f-serif);color:rgba(243,238,226,.78);
  border-left:2px solid rgba(201,162,77,.5);padding-left:12px}
.data-credits b{font:9px var(--f-mono);letter-spacing:2px;color:rgba(201,162,77,.8)}
.data-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 44px 14px;
  border-top:1px solid rgba(243,238,226,.16);font:9px var(--f-mono);letter-spacing:2px;color:rgba(243,238,226,.5)}
/* ========== P2 Radar (Douyin-friendly) ========== */
.p-radar{height:750px;display:flex;flex-direction:column}
.r-head{display:flex;align-items:center;gap:18px;padding:20px 40px 16px;border-bottom:2px solid var(--ink);position:relative;z-index:2}
.r-head .thumbbox{width:72px;height:72px;font-size:24px}
.r-head .who{flex:1;min-width:0}
.r-head .who .a{font:13px var(--f-mono);letter-spacing:4px;text-transform:uppercase;color:var(--ink-3)}
.r-head .who .t{font:700 28px/1.25 var(--f-sans);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.r-head .who .m{font:12px var(--f-mono);letter-spacing:1px;color:var(--ink-3);margin-top:4px}
.r-head .tot{text-align:right}
.r-head .tot .n{font:900 50px/1 var(--f-serif);color:var(--accent)}
.r-head .tot .n em{font:13px var(--f-mono);font-style:normal;color:var(--ink-3)}
.r-head .tot .l{font:11px var(--f-mono);letter-spacing:3px;color:var(--ink-3)}
.radar-zone{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 40px 0;min-height:0;position:relative;z-index:2}
.radar-box{display:flex;justify-content:center;align-items:center}
.radar-svg .grid{stroke:var(--line);fill:none}
.radar-svg .axis{stroke:var(--line-soft)}
.radar-svg .data-poly{fill:rgba(196,30,58,.12);stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.radar-svg .dot{fill:var(--accent)}
.radar-svg .lab{font-family:var(--f-sans);font-weight:500;font-size:15px;fill:var(--ink-2)}
.radar-svg .lab .lv{font-weight:700;fill:var(--ink);font-size:16px}
.mini-scores{display:flex;justify-content:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.mini{display:flex;align-items:baseline;gap:9px;border:1px solid var(--line);border-radius:99px;padding:9px 18px}
.mini b{font:900 22px/1 var(--f-serif)}
.mini span{font:11px var(--f-mono);letter-spacing:2px;color:var(--ink-3);text-transform:uppercase}
.mini i{font:700 19px var(--f-mono);font-style:normal}
.mini.hot{border-color:var(--accent)}
.mini.hot i{color:var(--accent)}
.r-verdict{text-align:center;padding:8px 60px 16px;position:relative;z-index:2;flex-shrink:0}
.r-verdict .vo{font:600 22px/1.4 var(--f-serif);color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r-verdict .vo::before{content:"「";color:var(--accent)}
.r-verdict .vo::after{content:"」";color:var(--accent)}
.r-verdict .heat{margin-top:8px;font:14px var(--f-mono);color:var(--gold);letter-spacing:2px}
.r-verdict .heat small{font-size:12px;color:var(--ink-3);letter-spacing:2px;margin-left:8px}
.r-verdict .brand{margin-top:10px;font:10px var(--f-mono);letter-spacing:3px;color:var(--ink-3)}

/* ========== P3..P7 Dimension pages ========== */
.p-dim{height:750px;display:flex;flex-direction:column}
.d-head{display:flex;justify-content:space-between;align-items:flex-end;
  padding:18px 52px 12px;border-bottom:2px solid var(--ink);position:relative;z-index:2}
.d-head .idx{font:11px var(--f-mono);letter-spacing:3px;color:var(--ink-3);line-height:1.8}
.d-head .idx b{display:block;font:900 28px/1.1 var(--f-serif);color:var(--ink);letter-spacing:1px}
.d-head .song{text-align:right;font:11px var(--f-mono);letter-spacing:1px;color:var(--ink-3);line-height:1.8}
.d-head .song b{font:600 14px var(--f-sans);color:var(--ink-2);letter-spacing:0}
.d-body{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;
  padding:18px 52px 18px;position:relative;z-index:2}
.d-name{display:flex;align-items:baseline;gap:16px}
.d-name .ch{font:900 72px/1 var(--f-serif)}
.d-name .en{font:12px var(--f-mono);letter-spacing:4px;text-transform:uppercase;color:var(--ink-3)}
.d-score-line{display:flex;align-items:flex-end;gap:18px;margin-top:16px}
.d-score{font:900 130px/0.9 var(--f-serif);letter-spacing:-3px}
.d-score small{font:400 24px var(--f-mono);color:var(--ink-3);letter-spacing:0;margin-left:4px}
.p-dim.hot .d-score{color:var(--accent)}
.d-level{font:11px var(--f-mono);letter-spacing:2px;border:1px solid var(--ink-3);color:var(--ink-3);
  padding:4px 14px;border-radius:99px;margin-bottom:10px}
.p-dim.hot .d-level{border-color:var(--accent);color:var(--accent)}
.d-bar{margin-top:4px;height:12px;background:var(--line-soft);position:relative;overflow:hidden;border-radius:99px}
.d-bar .fill{height:100%;width:0;background:var(--ink);border-radius:99px;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.p-dim.hot .d-bar .fill{background:linear-gradient(90deg,var(--accent-deep),var(--accent))}
.d-why{margin-top:6px;font:400 20px/1.7 var(--f-serif);color:var(--ink-2);
  border-left:3px solid var(--accent);padding-left:20px;max-width:32em;
  display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.d-foot{display:flex;justify-content:space-between;align-items:center;
  padding:14px 52px 18px;border-top:1px solid var(--line);position:relative;z-index:2;
  font:11px var(--f-mono);letter-spacing:2px;color:var(--ink-3)}

/* ========== Last Summary ========== */
.p-sum{height:750px;display:flex;flex-direction:column}
.sum-head{display:flex;align-items:center;gap:22px;text-align:left;padding:24px 48px 18px;border-bottom:1px solid var(--line);position:relative;z-index:2}
.sum-head .thumbbox{width:108px;height:108px;font-size:30px;box-shadow:6px 6px 0 var(--paper-2)}
.sum-head .a{font:13px var(--f-mono);letter-spacing:5px;text-transform:uppercase;color:var(--ink-3)}
.sum-head .t{font:900 36px/1.25 var(--f-serif);margin-top:5px}
.sum-head .m{font:12px var(--f-mono);letter-spacing:2px;color:var(--ink-3);margin-top:8px}
.sum-verdict{padding:12px 60px 4px;text-align:center;position:relative;z-index:2}
.sum-verdict .vh{font:11px var(--f-mono);letter-spacing:4px;color:var(--ink-3);margin-bottom:8px}
.sum-verdict .vo{font:600 24px/1.4 var(--f-serif);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sum-grid{display:grid;grid-template-columns:repeat(5,1fr);margin:18px 60px 0;
  border:1px solid var(--line);position:relative;z-index:2}
.sum-cell{padding:20px 4px 18px;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--line-soft)}
.sum-cell:last-child{border-right:none}
.sum-cell .nm{font:700 20px var(--f-sans)}
.sum-cell .en2{font:10px var(--f-mono);letter-spacing:0;color:var(--ink-3);text-transform:uppercase;margin-top:4px;white-space:nowrap}
.sum-cell .sc{font:900 46px/1 var(--f-serif);margin-top:12px}
.sum-cell.hot .sc{color:var(--accent)}
.sum-cell .lv{font:11px var(--f-mono);letter-spacing:2px;color:var(--ink-3);margin-top:12px;border:1px solid currentColor;border-radius:99px;padding:4px 12px;white-space:nowrap}
.sum-cell.hot .lv{color:var(--accent)}
.sum-tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:24px 60px 8px;color:var(--ink-2);position:relative;z-index:2}
.sum-rest{flex:0.6}
.sum-foot{padding:10px 48px 16px;border-top:2px solid var(--ink);position:relative;z-index:2}
.sum-foot .line1{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sum-foot .heat{font:14px var(--f-mono);color:var(--gold);letter-spacing:2px}
.sum-foot .heat small{font-size:10px;color:var(--ink-3);letter-spacing:2px}
.sum-foot .note{margin-top:6px;font:11px/1.7 var(--f-mono);color:var(--ink-3);letter-spacing:1px;
  border-top:1px dotted var(--line);padding-top:8px}
.sum-foot .sig{display:flex;justify-content:space-between;margin-top:8px;font:10px var(--f-mono);letter-spacing:3px;color:var(--ink-3)}

/* Pager */
.pager{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:50;
  display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(20,17,12,.85);
  border:1px solid rgba(243,238,226,.14);border-radius:99px;padding:10px 8px;
  box-shadow:0 16px 40px rgba(0,0,0,.5)}
.pager button{font:11px var(--f-mono);letter-spacing:1px;background:none;border:1px solid rgba(243,238,226,.2);
  color:#f3eee2;border-radius:99px;padding:7px 14px;cursor:pointer;transition:all .2s;white-space:nowrap}
.pager button:hover{border-color:var(--accent);color:#fff;background:rgba(196,30,58,.18)}
.pager .dots{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.pager .dot{width:7px;height:7px;border-radius:50%;background:rgba(243,238,226,.28);cursor:pointer;transition:all .25s;border:none;padding:0}
.pager .dot.on{background:var(--accent);transform:scale(1.35)}
.pager .sep{display:none}
.pager .page-no{font:10px var(--f-mono);color:rgba(243,238,226,.6);letter-spacing:2px;text-align:center}

/* Export mode */
body.exporting{padding:0}
body.exporting .stage{transform:none!important}
body.exporting .page{animation:none!important;box-shadow:none}
body.exporting .page *{animation:none!important;transition:none!important}
body.exporting .pager{display:none!important}

@media (max-width:820px){
  body{padding:16px 8px 120px}
  .pager{right:8px;gap:4px;padding:6px 5px}
  .pager .dots{gap:5px}
  .pager .dot{width:5px;height:5px}
}
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="stage" id="stage"><div class="pages" id="pages"></div></div>
</div>
<div class="pager">
  <button onclick="prevPage()">&#8592;</button>
  <div class="dots" id="dots"></div>
  <span class="page-no" id="page-no">1 / 1</span>
  <button onclick="nextPage()">&#8594;</button>
  <span class="sep"></span>
  <button onclick="exportCurrent()">导出本页</button>
  <button onclick="exportAll()">导出全部</button>
</div>
<script>
// ============ Data ============
function getCardData() {
  const urlParams = new URLSearchParams(window.location.search);
  const dataParam = urlParams.get("data");
  const tryParse = (s) => {
    try { return JSON.parse(s); } catch (e) {}
    try { return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch (e) {}
    try { return JSON.parse(atob(s)); } catch (e) {}
    return null;
  };
  if (dataParam) { const d = tryParse(dataParam); if (d) return d; }
  if (window.location.hash && window.location.hash.length > 1) {
    const d = tryParse(window.location.hash.slice(1)); if (d) return d;
  }
  if (window.__CARD_DATA__) return window.__CARD_DATA__;
  return {
    artist: "The Kills", title: "Future Starts Slow", year: "2011", label: "Domino",
    genre: "Garage Rock / Indie Rock", coverUrl: "",
    scores: {
      词: {score:10, rationale:"直白情绪宣泄，重复性强，符合车库摇滚的极简表达，但缺乏叙事深度"},
      曲: {score:14, rationale:"riff驱动的旋律线条简洁有力，副歌记忆点强烈，小调暗色与中快节奏咬合紧密"},
      编: {score:15, rationale:"层次分明，失真吉他与贝斯交替主导，从稀疏到密集的过渡控制精准"},
      唱: {score:14, rationale:"从低吟到嘶吼的张力控制精准，情感传达直接且具有爆发力"},
      混: {score:13, rationale:"保留车库的毛边感，低频控制好但高频偶有刺耳，整体温暖有质感"}
    },
    totalScore: 66,
    oneLiner: "粗粝riff驱动的压抑与爆发",
    tags: ["车库摇滚", "独立", "indie rock"],
    heat: { netease_comments: 2781 },
    note: "M44 Sound Anatomy · 2026-08-04",
  };
}

// ============ Helpers ============
function escapeHTML(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function extractScore(v){ return (typeof v === "number") ? v : (v && typeof v.score === "number" ? v.score : null); }
function extractRationale(v){ return (v && typeof v === "object" && v.rationale) ? v.rationale : ""; }

const dims = ["词","曲","编","唱","混"];
const dimsEn = ["Lyrics","Composition","Arrangement","Performance","Production"];
const maxScore = 20;

function levelOf(v){ return v >= 18 ? "优秀" : v >= 16 ? "良好" : v >= 12 ? "一般" : v >= 10 ? "合格" : "短板"; }
function calcHeat(heat) {
  const h = heat || {};
  const comments = (h.netease_song_comments || 0) + (h.netease_album_comments || 0) + (h.netease_comments || 0);
  const domStars = comments >= 50000 ? 5 : comments >= 5000 ? 4 : comments >= 999 ? 3 : comments >= 300 ? 2 : comments >= 100 ? 1 : 0;
  return {
    stars: domStars,
    label: "★".repeat(domStars) + "☆".repeat(5 - domStars),
    comments,
    domestic: { stars: domStars, label: "★".repeat(domStars) + "☆".repeat(5 - domStars), sources: [], detail: comments ? ("网易云评论 " + comments) : "无国内热度数据" },
    international: { stars: 0, label: "○○○○○", sources: [], detail: "无国外热度数据" },
  };
}
function getHeatScore(data) {
  if (data.heatScore && typeof data.heatScore.stars === "number") {
    const h = data.heatScore;
    const label = h.label || ("★".repeat(h.stars) + "☆".repeat(5 - h.stars));
    if (h.domestic && h.international) return h;
    // 兼容旧版 heatScore（无 domestic/international 分拆）
    return {
      stars: h.stars,
      label,
      comments: (data.heat && data.heat.netease_comments) || 0,
      domestic: { stars: h.stars, label, sources: h.sources || [], detail: (h.sources || []).join("；") || "无国内热度数据" },
      international: { stars: 0, label: "○○○○○", sources: [], detail: "无国外热度数据" },
    };
  }
  return calcHeat(data.heat);
}
function hashHue(str) {
  let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h % 360;
}
function activeDims(scores){ return dims.filter(d => extractScore(scores[d]) !== null); }

// ============ Radar ============
function renderRadar(scoresData, size) {
  const pad = 28;
  const vs = size + pad*2;
  const cx = vs/2, cy = vs/2, r = size*0.31, labelR = size*0.40;
  const useDims = activeDims(scoresData);
  const vals = useDims.map(d => extractScore(scoresData[d]) || 0);
  const n = useDims.length;
  const step = (2*Math.PI)/n, start = -Math.PI/2;
  const pt = (i, v, rr) => {
    const a = start + i*step;
    const rad = (rr !== undefined ? rr : r*(v/maxScore));
    return [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
  };
  let grid = "";
  for (let ring = 1; ring <= 4; ring++) {
    const pts = useDims.map((_, i) => pt(i, 0, r*ring/4).map(x => x.toFixed(1)).join(",")).join(" ");
    grid += '<polygon class="grid" points="' + pts + '" stroke-width="' + (ring===4 ? 1.2 : 0.5) + '"/>';
  }
  let axes = "";
  useDims.forEach((_, i) => {
    const p = pt(i, 0, r);
    axes += '<line class="axis" x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke-width="0.5"/>';
  });
  const polyPts = useDims.map((_, i) => pt(i, vals[i]).map(x => x.toFixed(1)).join(",")).join(" ");
  let dots = "", labels = "";
  useDims.forEach((d, i) => {
    const p = pt(i, vals[i]);
    dots += '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4"/>';
    const lp = pt(i, 0, labelR);
    const a = start + i*step;
    const cos = Math.cos(a);
    const anchor = Math.abs(cos) < 0.35 ? "middle" : (cos > 0 ? "start" : "end");
    const dx = anchor === "start" ? 6 : anchor === "end" ? -6 : 0;
    labels += '<text class="lab" x="' + (lp[0]+dx).toFixed(1) + '" y="' + lp[1].toFixed(1) + '" text-anchor="' + anchor + '" dominant-baseline="central">' + d + ' <tspan class="lv">' + vals[i] + '</tspan></text>';
  });
  return '<svg class="radar-svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + vs + ' ' + vs + '">' +
    grid + axes +
    '<polygon class="data-poly" points="' + polyPts + '"/>' +
    dots + labels + '</svg>';
}

function animateRadar(svgEl) {
  if (document.body.classList.contains("exporting")) return;
  const poly = svgEl.querySelector(".data-poly");
  if (!poly) return;
  let len = 1600;
  try { len = poly.getTotalLength(); } catch (e) {}
  poly.style.transition = "none";
  poly.style.strokeDasharray = len;
  poly.style.strokeDashoffset = len;
  poly.style.fillOpacity = "0";
  requestAnimationFrame(() => {
    poly.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1) .15s, fill-opacity .8s ease .8s";
    poly.style.strokeDashoffset = "0";
    poly.style.fillOpacity = "1";
  });
  svgEl.querySelectorAll(".dot").forEach((d, i) => {
    d.style.transition = "none";
    d.style.opacity = "0";
    requestAnimationFrame(() => {
      d.style.transition = "opacity .4s ease " + (0.9 + i*0.08) + "s";
      d.style.opacity = "1";
    });
  });
}
// ============ Page Renderers ============
function coverTint(url){ return url ? '<div class="cover-tint" style="background-image:url(\'' + escapeHTML(url) + '\')"></div>' : ""; }
function corners(){ return '<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>'; }
function thumbImg(data, size){
  if (data.coverUrl) {
    return '<img src="' + escapeHTML(data.coverUrl) + '" alt="" onerror="this.style.display=\'none\';this.parentElement.classList.add(\'noart\')">';
  }
  var letter = escapeHTML(((data.artist || data.title || "?").trim().charAt(0) || "?").toUpperCase());
  return '<span class="thumb-letter">' + letter + '</span>';
}
function metaOf(data){ return [data.year, data.label, data.genre].filter(Boolean).join(" · "); }
function localDate(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateOf(data){
  const m = (data.note || "").match(/\d{4}-\d{2}-\d{2}/);
  return m ? m[0] : localDate();
}
function heatText(heat){
  const h = heat || {};
  const dom = h.domestic || {};
  const intl = h.international || {};
  const parts = [];
  if (dom.stars) parts.push("国内 " + dom.label);
  if (intl.stars) parts.push("国外 " + intl.label);
  if (!parts.length && h.stars) parts.push(h.label);
  if (!parts.length) return "";
  return parts.join(" · ") + "<small>热度 HEAT</small>";
}
function oneLinerWrap(text) {
  if (!text) return "";
  return /[\u4e00-\u9fff]/.test(text) ? "「" + text + "」" : "\u201C" + text + "\u201D";
}

function renderCoverPage(data) {
  const heat = getHeatScore(data);
  const hue = hashHue((data.artist||"") + (data.title||""));
  const meta = metaOf(data);
  const full = activeDims(data.scores).length * maxScore;
  const sleeve = data.coverUrl
    ? '<div class="sleeve" style="background-image:url(\'' + escapeHTML(data.coverUrl) + '\')"></div>'
    : '<div class="sleeve noart"><span>' + escapeHTML((data.artist || "♪").trim().charAt(0).toUpperCase()) + '</span></div>';
  return '<section class="page p-cover" style="--hue:' + hue + '">' +
    '<div class="glow"></div>' +
    '<div class="inner">' +
      '<div class="cover-top">' +
        '<div class="brand">M44 <b>/</b> ' + (data.mode === "album" ? 'ALBUM CARD' : 'SOUND ANATOMY') + '</div>' +
        '<div class="date">' + (data.mode === "album" ? 'ALBUM REVIEW' : 'REVIEW REPORT') + '<br>' + dateOf(data) + '</div>' +
      '</div>' +
      (data.mode === "album" && data.trackCount ? '<div style="position:relative;z-index:2;text-align:center;padding:4px 0"><span style="font:9px var(--f-mono);letter-spacing:3px;color:rgba(243,238,226,.45)">' + data.trackCount + ' TRACKS AGGREGATED</span></div>' : "") +
      '<div class="sleeve-zone">' + sleeve + '</div>' +
      '<div class="cover-info">' +
        '<div class="c-artist">' + escapeHTML(data.artist || "Unknown Artist") + '</div>' +
        '<h1 class="c-title">' + escapeHTML(data.title || "Untitled") + '</h1>' +
        (meta ? '<div class="c-meta">' + escapeHTML(meta) + '</div>' : "") +
        '<div class="c-score-band">' +
          '<div class="c-total"><span class="num">' + (data.totalScore ?? "—") + '</span>' +
            '<span class="of">/ ' + full + '<br>TOTAL SCORE 总分</span></div>' +
          (heat.stars > 0 ? '<div class="c-heat">' + heatText(heat) + '</div>' : "") +
        '</div>' +
        (data.oneLiner ? '<div class="c-oneliner">' + escapeHTML(oneLinerWrap(data.oneLiner)) + '</div>' : "") +
        (data.mode === "album" && data.hitTracks && data.hitTracks.length ? '<div class="c-tags" style="font-size:13px">' + data.hitTracks.map(t => '<span class="chip">🔥 ' + escapeHTML(t) + '</span>').join("") + '</div>' : (data.tags && data.tags.length ? '<div class="c-tags">' + data.tags.map(t => '<span class="chip">#' + escapeHTML(t) + '</span>').join("") + '</div>' : "")) +
        (data.receptionQuotes && data.receptionQuotes.length ? '<div class="c-summary">' + data.receptionQuotes.map(q => '「' + escapeHTML(q) + '」').join('<br>') + '</div>' : "") +
        '</div>' +
    '</div>' +
  '</section>';
}

function renderDataPage(data) {
  const heat = getHeatScore(data);
  const meta = metaOf(data);
  const dp = data.dataPage || {};
  const params = dp.params || [];
  const hue = hashHue((data.artist || "") + (data.title || ""));
  const rows = params.map(p =>
    '<div class="data-cell"><span class="k">' + escapeHTML(p.label) + '</span><span class="v">' + escapeHTML(p.value) + '</span>' +
    (p.source ? '<span class="s">' + escapeHTML(p.source) + '</span>' : "") + '</div>'
  ).join("");
  const heatDom = heat.domestic || {};
  const heatIntl = heat.international || {};
  const chartsHtml = (dp.charts || []).slice(0, 5).map(c =>
    '<div class="drow"><span class="dk">' + escapeHTML(c.chart) + '</span><span class="dv">#' + escapeHTML(c.peak) + '</span></div>'
  ).join("");
  const yearHtml = (dp.yearEnd || []).slice(0, 4).map(y =>
    '<div class="drow"><span class="dk">' + escapeHTML(y.publication) + '</span><span class="dm">' + escapeHTML(y.list || "") + '</span><span class="dv">' + (y.rank ? '#' + escapeHTML(y.rank) : "—") + '</span></div>'
  ).join("");
  const ratings = dp.ratings || { aggregate: [], reviews: [] };
  const aggHtml = (ratings.aggregate || []).map(r =>
    '<div class="drow"><span class="dk">' + escapeHTML(r.source) + '</span><span class="dv">' + escapeHTML(r.rating) + '</span></div>'
  ).join("");
  const revHtml = (ratings.reviews || []).slice(0, 6).map(r =>
    '<div class="drow"><span class="dk">' + escapeHTML(r.source) + '</span><span class="dv">' + escapeHTML(r.rating) + '</span></div>'
  ).join("");
  const credits = dp.credits;
  const creditHtml = credits
    ? '<div class="data-credits"><b>Credits</b> ' +
      (credits.writers && credits.writers.length ? 'Writer(s): ' + escapeHTML(credits.writers.join(" / ")) : "") +
      (credits.producers && credits.producers.length ? ' · Producer(s): ' + escapeHTML(credits.producers.join(" / ")) : "") +
      '</div>'
    : "";
  return '<section class="page p-data" style="--hue:' + hue + '">' +
    '<div class="glow"></div>' +
    corners() +
    '<div class="inner">' +
      '<header class="data-head">' +
        '<div class="thumbbox">' + thumbImg(data) + '</div>' +
        '<div class="who">' +
          '<div class="a">' + escapeHTML(data.artist || "") + '</div>' +
          '<div class="t">' + escapeHTML(data.title || "") + '</div>' +
          (meta ? '<div class="m">' + escapeHTML(meta) + '</div>' : "") +
        '</div>' +
        '<div class="tot"><div class="n">' + (data.totalScore ?? "—") + '<em>/' + (activeDims(data.scores).length * maxScore) + '</em></div><div class="l">TOTAL 总分</div></div>' +
      '</header>' +
      '<div class="data-body">' +
        (rows ? '<div class="data-grid">' + rows + '</div>' : "") +
        '<div class="data-heat">' +
          '<div class="hcard"><div class="hk">国内热度 DOMESTIC</div><div class="hv">' + escapeHTML(heatDom.label || "☆☆☆☆☆") + '</div><div class="hd">' + escapeHTML(heatDom.detail || "无数据") + '</div></div>' +
          '<div class="hcard"><div class="hk">国外热度 OVERSEAS</div><div class="hv">' + escapeHTML(heatIntl.label || "○○○○○") + '</div><div class="hd">' + escapeHTML(heatIntl.detail || "无数据") + '</div></div>' +
        '</div>' +
        (chartsHtml ? '<div class="data-block"><div class="data-block-title">CHARTS</div>' + chartsHtml + '</div>' : "") +
        (yearHtml ? '<div class="data-block"><div class="data-block-title">YEAR-END LISTS</div>' + yearHtml + '</div>' : "") +
        ((aggHtml || revHtml) ? '<div class="data-block"><div class="data-block-title">PROFESSIONAL RATINGS</div>' +
          (aggHtml ? '<div class="data-sub">Aggregate</div>' + aggHtml : "") +
          (revHtml ? '<div class="data-sub">Reviews</div>' + revHtml : "") +
          '</div>' : "") +
        creditHtml +
      '</div>' +
      '<footer class="data-foot"><span>M44 SOUND ANATOMY</span><span>VERIFIED DATA · ' + dateOf(data) + '</span></footer>' +
    '</div>' +
  '</section>';
}

function renderRadarPage(data) {
  const heat = getHeatScore(data);
  const meta = metaOf(data);
  const full = activeDims(data.scores).length * maxScore;
  const minis = dims.map((d, i) => {
    const v = extractScore(data.scores[d]);
    if (v === null) return "";
    return '<div class="mini' + (v >= 17 ? " hot" : "") + '"><b>' + d + '</b><span>' + dimsEn[i] + '</span><i>' + v + '</i></div>';
  }).join("");
  return '<section class="page p-radar">' +
    coverTint(data.coverUrl) +
    '<div class="frame-line"></div>' + corners() +
    '<header class="r-head">' +
      '<div class="thumbbox">' + thumbImg(data) + '</div>' +
      '<div class="who">' +
        '<div class="a">' + escapeHTML(data.artist || "") + '</div>' +
        '<div class="t">' + escapeHTML(data.title || "") + '</div>' +
        (meta ? '<div class="m">' + escapeHTML(meta) + '</div>' : "") +
      '</div>' +
      '<div class="tot"><div class="n">' + (data.totalScore ?? "—") + '<em>/' + full + '</em></div><div class="l">TOTAL 总分</div></div>' +
    '</header>' +
    '<div class="radar-zone">' +
      '<div class="radar-box">' + renderRadar(data.scores, 340) + '</div>' +
      '<div class="mini-scores">' + minis + '</div>' +
    '</div>' +
    '<div class="r-verdict">' +
      (data.oneLiner ? '<div class="vo">' + escapeHTML(data.oneLiner) + '</div>' : "") +
      (heat.stars > 0 ? '<div class="heat">' + heatText(heat) + '</div>' : "") +
      '<div class="brand">M44 SOUND ANATOMY · ' + dateOf(data) + '</div>' +
    '</div>' +
  '</section>';
}

function renderDimPage(data, d, idx, pos, count) {
  const raw = data.scores[d];
  const val = extractScore(raw);
  const why = extractRationale(raw);
  const en = dimsEn[dims.indexOf(d)];
  const hot = val >= 17;
  const pct = (val/maxScore)*100;
  return '<section class="page p-dim' + (hot ? " hot" : "") + '">' +
    coverTint(data.coverUrl) +
    '<div class="frame-line"></div>' + corners() +
    '<header class="d-head">' +
      '<div class="idx">DIMENSION<b>N°' + (pos+1) + ' / ' + count + '</b></div>' +
      '<div class="song">' + escapeHTML(data.artist || "") + '<br><b>' + escapeHTML(data.title || "") + '</b></div>' +
    '</header>' +
    '<div class="d-body">' +
      '<div class="d-name"><span class="ch">' + d + '</span><span class="en">' + en + '</span></div>' +
      '<div class="d-score-line">' +
        '<div class="d-score">' + val + '<small>/20</small></div>' +
        '<div class="d-level">' + levelOf(val) + '</div>' +
      '</div>' +
      '<div class="d-bar"><div class="fill" data-w="' + pct + '"></div></div>' +
      (why ? '<div class="d-why">' + escapeHTML(why) + '</div>' : "") +
    '</div>' +
    '<footer class="d-foot"><span>M44 SOUND ANATOMY</span><span>' + escapeHTML(en.toUpperCase()) + ' · ' + (pos+1) + ' / ' + count + '</span></footer>' +
  '</section>';
}

function renderSummaryPage(data) {
  const heat = getHeatScore(data);
  const meta = metaOf(data);
  const cells = dims.map((d, i) => {
    const v = extractScore(data.scores[d]);
    if (v === null) return "";
    return '<div class="sum-cell' + (v >= 17 ? " hot" : "") + '">' +
      '<div class="nm">' + d + '</div><div class="en2">' + dimsEn[i] + '</div><div class="sc">' + v + '</div>' +
      '<span class="lv">' + levelOf(v) + '</span></div>';
  }).join("");
  return '<section class="page p-sum">' +
    coverTint(data.coverUrl) +
    '<div class="frame-line"></div>' + corners() +
    '<div class="sum-head">' +
      '<div class="thumbbox">' + thumbImg(data) + '</div>' +
      '<div class="who">' +
        '<div class="a">' + escapeHTML(data.artist || "") + '</div>' +
        '<div class="t">' + escapeHTML(data.title || "") + '</div>' +
        (meta ? '<div class="m">' + escapeHTML(meta) + '</div>' : "") +
      '</div>' +
    '</div>' +
    '<div class="sum-verdict">' +
      '<div class="vh">VERDICT 总评</div>' +
      '<div class="vo">' + escapeHTML(data.oneLiner || "") + '</div>' +
    '</div>' +
    '<div class="sum-grid">' + cells + '</div>' +
    (data.mode === "album" && data.hitTracks && data.hitTracks.length ? '<div class="sum-tags">' + data.hitTracks.map(t => '<span class="chip">🔥 ' + escapeHTML(t) + '</span>').join("") + '</div>' : (data.tags && data.tags.length ? '<div class="sum-tags">' + data.tags.map(t => '<span class="chip">#' + escapeHTML(t) + '</span>').join("") + '</div>' : "")) +
    '<div class="sum-rest"></div>' +
    '<footer class="sum-foot">' +
      '<div class="line1">' +
        (heat.stars > 0 ? '<div class="heat">' + heatText(heat) + '</div>' : "<span></span>") +
        '<div class="chip">总分 ' + (data.totalScore ?? "—") + '</div>' +
      '</div>' +
      (data.note ? '<div class="note">' + escapeHTML(data.note) + '</div>' : "") +
      '<div class="sig"><span>M44 SOUND ANATOMY</span><span>GENERATED ' + dateOf(data) + '</span></div>' +
    '</footer>' +
  '</section>';
}
// ============ Pager / Stage ============
let pageEls = [];
let currentPage = 0;
const _shownPages = new Set(); // 每页只动画一次

function fitStage() {
  const stage = document.getElementById("stage");
  if (document.body.classList.contains("exporting")) { stage.style.transform = ""; stage.style.height = ""; return; }
  const scale = Math.min(1, (window.innerWidth - 24) / 750);
  stage.style.transform = "scale(" + scale + ")";
  const active = pageEls[currentPage];
  if (active) stage.style.height = (active.offsetHeight * scale) + "px";
}

function lockPageLayout(el) {
  el.querySelectorAll(".d-bar .fill").forEach(f => {
    f.style.transition = "none";
    f.style.width = f.dataset.w + "%";
  });
  const poly = el.querySelector(".data-poly");
  if (poly) { poly.style.strokeDasharray = "none"; poly.style.strokeDashoffset = "0"; poly.style.fillOpacity = "1"; }
  el.querySelectorAll(".dot").forEach(d => { d.style.opacity = "1"; });
  el.classList.add("locked");
}

function showPage(i) {
  currentPage = Math.max(0, Math.min(pageEls.length - 1, i));
  pageEls.forEach((p, idx) => p.classList.toggle("active", idx === currentPage));
  document.querySelectorAll(".pager .dot").forEach((d, idx) => d.classList.toggle("on", idx === currentPage));
  document.getElementById("page-no").textContent = (currentPage + 1) + " / " + pageEls.length;
  const active = pageEls[currentPage];
  if (!active) return;

  if (!_shownPages.has(currentPage)) {
    // 首次展示：正常动画
    _shownPages.add(currentPage);
    const radar = active.querySelector(".radar-svg");
    if (radar) animateRadar(radar);
    active.querySelectorAll(".d-bar .fill").forEach(f => {
      f.style.transition = "none";
      f.style.width = "0%";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        f.style.transition = "";
        f.style.width = f.dataset.w + "%";
      }));
    });
    // 动画结束后锁定布局
    setTimeout(() => lockPageLayout(active), 1200);
  } else {
    // 非首次：直接锁定，不重播动画
    lockPageLayout(active);
  }

  fitStage();
}
function nextPage(){ showPage(currentPage + 1); }
function prevPage(){ showPage(currentPage - 1); }

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") nextPage();
  if (e.key === "ArrowLeft") prevPage();
});
let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, {passive:true});
document.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) { if (dx < 0) nextPage(); else prevPage(); }
  touchX = null;
}, {passive:true});
window.addEventListener("resize", fitStage);

// ============ Boot ============
function renderAll(data) {
  const useDims = activeDims(data.scores || {});
  let html = renderCoverPage(data) + renderDataPage(data) + renderRadarPage(data);
  useDims.forEach((d, i) => { html += renderDimPage(data, d, i, i, useDims.length); });
  html += renderSummaryPage(data);
  document.getElementById("pages").innerHTML = html;
  pageEls = Array.from(document.querySelectorAll(".page"));
}

let cardData = null;
try {
  cardData = getCardData();
  document.title = "M44 · " + (cardData.artist || "") + " — " + (cardData.title || "");
  renderAll(cardData);
  document.getElementById("dots").innerHTML = pageEls
    .map((_, i) => '<button class="dot' + (i===0 ? " on" : "") + '" onclick="showPage(' + i + ')" aria-label="第' + (i+1) + '页"></button>')
    .join("");
  const p0 = parseInt(new URLSearchParams(window.location.search).get("p") || "0", 10);
  showPage(isNaN(p0) ? 0 : p0);

  if (!cardData.coverUrl && cardData.artist && cardData.title) {
    const q = encodeURIComponent(cardData.artist + " " + cardData.title);
    const applyCover = (src) => {
      if (!src || cardData.coverUrl) return;
      cardData.coverUrl = src;
      renderAll(cardData);
      showPage(currentPage);
    };
    const wikiFallback = () => fetch("https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&titles=" + q + "&format=json&origin=*&piprop=thumbnail&pithumbsize=600")
      .then(r => r.json()).then(d => {
        const page = Object.values((d && d.query && d.query.pages) || {})[0];
        applyCover(page && page.thumbnail && page.thumbnail.source);
      }).catch(() => {});
    fetch("https://itunes.apple.com/search?term=" + q + "&media=music&entity=song&limit=5")
      .then(r => r.json()).then(d => {
        const results = (d && d.results) || [];
        const norm = (x) => (x || "").toLowerCase().trim();
        const hit = results.find(x => norm(x.trackName) === norm(cardData.title)) || results[0];
        const art = hit && hit.artworkUrl100 ? hit.artworkUrl100.replace("100x100", "3000x3000") : "";
        if (art) applyCover(art); else wikiFallback();
      }).catch(wikiFallback);
  }
} catch (err) {
  document.getElementById("pages").innerHTML =
    '<div style="padding:60px;color:#c41e3a;font:13px monospace">渲染错误: ' + escapeHTML(err.message) + '</div>';
}

// ============ Export ============
function getH2C() { return window.html2canvas; }
async function download(canvas, name) {
  const dataURL = canvas.toDataURL("image/png");
  const API = (cardData && cardData._apiBase) || "";
  const folder = (cardData && cardData.artist && cardData.title)
    ? (cardData.artist + " - " + cardData.title).replace(/[\\/:*?"<>|]/g, "_")
    : "";
  try {
    const res = await fetch(API + "/api/save-export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data: dataURL, name, folder }),
    });
    if (res.ok) {
      const j = await res.json();
      if (j.success) console.log("Saved: " + j.path);
      return;
    }
  } catch (e) {}
  const a = document.createElement("a");
  a.download = name;
  a.href = dataURL;
  a.click();
}
function prepStatic(el) {
  el.querySelectorAll(".d-bar .fill").forEach(f => { f.style.width = f.dataset.w + "%"; });
  const poly = el.querySelector(".data-poly");
  if (poly) { poly.style.strokeDasharray = "none"; poly.style.strokeDashoffset = "0"; poly.style.fillOpacity = "1"; }
  el.querySelectorAll(".dot").forEach(d => { d.style.opacity = "1"; });
}
async function snapPage(i) {
  showPage(i);
  const el = pageEls[i];
  lockPageLayout(el);
  await new Promise(r => setTimeout(r, 300));
  const h2c = getH2C();
  if (!h2c) throw new Error("html2canvas not loaded");
  // 封面已是 base64 同源数据，不需要 CORS
  return await h2c(el, { scale: 4, backgroundColor: i === 0 ? "#1c1813" : "#faf7f1", useCORS: false, allowTaint: false, logging: false });
}
async function withExportMode(fn) {
  document.body.classList.add("exporting");
  try { await document.fonts.ready; return await fn(); }
  finally {
    document.body.classList.remove("exporting");
    showPage(currentPage);
  }
}
function slug(){ return ((cardData && (cardData.artist + "-" + cardData.title)) || "scorecard").replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 50); }
function ts(){ return new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19); }
async function exportPage(i) {
  await withExportMode(async () => { const c = await snapPage(i); download(c, slug() + "-p" + (i+1) + "-" + ts() + ".png"); });
}
async function exportCurrent() { await exportPage(currentPage); }
async function exportRadar() { await exportPage(pageEls.length > 1 ? 1 : 0); }
async function exportAll() {
  const t = ts();
  await withExportMode(async () => {
    for (let i = 0; i < pageEls.length; i++) {
      const c = await snapPage(i);
      download(c, slug() + "-p" + (i+1) + "-" + t + ".png");
      await new Promise(r => setTimeout(r, 400));
    }
  });
}
window.exportAll = exportAll;
window.exportCurrent = exportCurrent;
window.exportRadar = exportRadar;
</script>
