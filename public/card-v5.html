<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌掘士 — 声音解剖报告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #faf7f1; --paper-2: #f1ece2; --ink: #17130d; --ink-2: #4d4639;
  --ink-3: #8a8172; --line: #ddd5c4; --line-soft: #e9e3d5;
  --accent: #c41e3a; --accent-deep: #9d1530; --gold: #b08d3e;
  --night: #12100c; --night-2: #1c1813;
  --f-serif: "Noto Serif SC", "Songti SC", Georgia, serif;
  --f-sans: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
  --f-mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--night)}
body{
  min-height:100vh;color:var(--ink);font:15px/1.7 var(--f-serif);
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(196,30,58,.08), transparent 60%),
    var(--night);
  display:flex;flex-direction:column;align-items:center;
  padding:28px 16px 120px;
}

/* Stage (responsive scale) */
.stage-wrap{width:750px;max-width:100%}
.stage{transform-origin:top center;position:relative}
.pages{position:relative}
.page{
  width:750px;background:var(--paper);position:relative;overflow:hidden;
  display:none;box-shadow:0 30px 80px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4);
}
.page.active{display:block;animation:pageIn .55s cubic-bezier(.22,1,.36,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}

/* Shared bits */
.cover-bg{position:absolute;inset:-24px;background-size:cover;background-position:center;
  filter:grayscale(100%) blur(6px);opacity:.07}
.frame-line{position:absolute;inset:14px;border:1px solid var(--line);pointer-events:none;z-index:3}
.corner{position:absolute;width:14px;height:14px;z-index:4;pointer-events:none}
.corner.tl{top:8px;left:8px;border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.corner.tr{top:8px;right:8px;border-top:2px solid var(--ink);border-right:2px solid var(--ink)}
.corner.bl{bottom:8px;left:8px;border-bottom:2px solid var(--ink);border-left:2px solid var(--ink)}
.corner.br{bottom:8px;right:8px;border-bottom:2px solid var(--ink);border-right:2px solid var(--ink)}
.brandmark{font:10px var(--f-mono);letter-spacing:4px;color:var(--ink-3)}
.chip{display:inline-block;font:10px var(--f-mono);letter-spacing:1px;border:1px solid currentColor;
  padding:2px 9px;border-radius:99px;opacity:.75}

/* ========== Page 1 - Cover ========== */
.p-cover{height:1000px;background:var(--night-2);color:#f3eee2}
.p-cover .art{position:absolute;inset:0;background-size:cover;background-position:center;
  animation:kenburns 22s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08)}}
.p-cover.noart .art{display:none}
.p-cover .shade{position:absolute;inset:0;background:
  linear-gradient(180deg, rgba(18,16,12,.55) 0%, rgba(18,16,12,.12) 30%, rgba(18,16,12,.35) 55%, rgba(18,16,12,.93) 100%)}
.p-cover.noart .shade{background:
  radial-gradient(900px 600px at 80% 10%, hsla(var(--hue,352),55%,32%,.5), transparent 60%),
  radial-gradient(700px 700px at 10% 90%, hsla(var(--hue,352),60%,22%,.6), transparent 65%),
  var(--night-2)}
.p-cover .inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:44px 48px 40px}
.cover-top{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:1px solid rgba(243,238,226,.25);padding-bottom:16px}
.cover-top .brand{font:11px var(--f-mono);letter-spacing:5px;color:#f3eee2}
.cover-top .brand b{color:var(--accent);font-weight:400}
.cover-top .date{font:10px var(--f-mono);letter-spacing:2px;color:rgba(243,238,226,.6);text-align:right;line-height:1.8}
.cover-mid{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:8px}
.c-artist{font:12px var(--f-mono);letter-spacing:6px;text-transform:uppercase;color:rgba(243,238,226,.85);margin-bottom:10px}
.c-title{font:900 58px/1.15 var(--f-serif);letter-spacing:-1px;max-width:14em;
  animation:riseIn .8s .15s cubic-bezier(.22,1,.36,1) both}
.c-meta{font:11px var(--f-mono);letter-spacing:2px;color:rgba(243,238,226,.65);margin-top:14px;
  animation:riseIn .8s .3s cubic-bezier(.22,1,.36,1) both}
.c-score-band{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  margin-top:34px;padding-top:26px;border-top:1px solid rgba(243,238,226,.25);
  animation:riseIn .8s .45s cubic-bezier(.22,1,.36,1) both}
.c-total{display:flex;align-items:baseline;gap:10px}
.c-total .num{font:900 118px/0.9 var(--f-serif);color:#f3eee2;letter-spacing:-4px}
.c-total .num i{font-style:normal;color:var(--accent)}
.c-total .of{font:14px var(--f-mono);color:rgba(243,238,226,.55)}
.c-total .lab{display:block;font:10px var(--f-mono);letter-spacing:4px;color:rgba(243,238,226,.55);margin-top:10px}
.c-heat{font:13px var(--f-mono);color:var(--gold);letter-spacing:2px;text-align:right}
.c-heat small{display:block;font-size:9px;letter-spacing:3px;color:rgba(243,238,226,.5);margin-top:2px}
.c-oneliner{margin-top:26px;font:italic 600 22px/1.5 var(--f-serif);color:#f3eee2;
  animation:riseIn .8s .6s cubic-bezier(.22,1,.36,1) both}
.c-oneliner::before{content:"「";color:var(--accent)}
.c-oneliner::after{content:"」";color:var(--accent)}
.c-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;color:rgba(243,238,226,.8);
  animation:riseIn .8s .7s cubic-bezier(.22,1,.36,1) both}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ========== Page 2 - Scores ========== */
.p-scores{min-height:1000px}
.s-head{display:flex;align-items:center;gap:18px;padding:30px 40px 24px;border-bottom:2px solid var(--ink);position:relative;z-index:2}
.s-head .thumb{width:64px;height:64px;flex-shrink:0;border:1px solid var(--line);overflow:hidden;
  background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:22px}
.s-head .thumb img{width:100%;height:100%;object-fit:cover}
.s-head .who{flex:1;min-width:0}
.s-head .who .a{font:10px var(--f-mono);letter-spacing:4px;text-transform:uppercase;color:var(--ink-3)}
.s-head .who .t{font:700 21px/1.25 var(--f-sans);margin-top:2px}
.s-head .who .m{font:10px var(--f-mono);letter-spacing:1px;color:var(--ink-3);margin-top:3px}
.s-head .tot{text-align:right}
.s-head .tot .n{font:900 46px/1 var(--f-serif)}
.s-head .tot .n em{font:12px var(--f-mono);font-style:normal;color:var(--ink-3)}
.s-head .tot .l{font:9px var(--f-mono);letter-spacing:3px;color:var(--ink-3)}
.s-body{display:flex;gap:8px;padding:34px 40px 10px;position:relative;z-index:2;align-items:stretch}
.radar-box{flex:0 0 350px;display:flex;justify-content:center;align-items:center}
.verdict{flex:1;padding-left:26px;border-left:1px solid var(--line-soft);margin-left:10px;
  display:flex;flex-direction:column;justify-content:center}
.verdict .vh{font:10px var(--f-mono);letter-spacing:4px;color:var(--ink-3);margin-bottom:10px}
.verdict .vo{font:italic 600 19px/1.6 var(--f-serif);color:var(--ink)}
.verdict .vt{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;color:var(--ink-2)}
.verdict .vheat{margin-top:16px;font:12px var(--f-mono);color:var(--gold);letter-spacing:2px}
.verdict .vheat small{color:var(--ink-3);letter-spacing:2px;font-size:9px;display:block;margin-top:2px}
.s-bars{padding:26px 40px 8px;position:relative;z-index:2}
.bar-row{padding:13px 0;border-bottom:1px dotted var(--line);animation:riseIn .6s both}
.bar-row:nth-child(1){animation-delay:.35s}.bar-row:nth-child(2){animation-delay:.45s}
.bar-row:nth-child(3){animation-delay:.55s}.bar-row:nth-child(4){animation-delay:.65s}
.bar-row:nth-child(5){animation-delay:.75s}
.bar-top{display:flex;align-items:center;gap:14px}
.bar-dim{width:56px;flex-shrink:0}
.bar-dim b{font:900 26px/1 var(--f-serif)}
.bar-dim span{display:block;font:8px var(--f-mono);letter-spacing:1px;color:var(--ink-3);text-transform:uppercase;margin-top:2px}
.bar-track{flex:1;height:10px;background:var(--line-soft);position:relative;overflow:hidden}
.bar-track .fill{height:100%;width:0;background:var(--ink);transition:width 1s cubic-bezier(.22,1,.36,1)}
.bar-row.hot .bar-track .fill{background:linear-gradient(90deg,var(--accent-deep),var(--accent))}
.bar-val{font:700 18px var(--f-mono);min-width:44px;text-align:right}
.bar-val small{font-size:10px;color:var(--ink-3);font-weight:400}
.bar-level{font:9px var(--f-mono);letter-spacing:2px;min-width:44px;text-align:center;border:1px solid var(--line);padding:3px 0;color:var(--ink-3)}
.bar-row.hot .bar-level{border-color:var(--accent);color:var(--accent)}
.bar-why{font:italic 13px/1.7 var(--f-serif);color:var(--ink-2);padding:6px 0 0 70px}
.s-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:18px 40px 24px;margin-top:14px;border-top:2px solid var(--ink);position:relative;z-index:2;flex-wrap:wrap}
.s-foot .note{font:10px var(--f-mono);color:var(--ink-3);letter-spacing:1px}
.radar-svg .grid{stroke:var(--line);fill:none}
.radar-svg .axis{stroke:var(--line-soft)}
.radar-svg .data-poly{fill:rgba(196,30,58,.10);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.radar-svg .dot{fill:var(--accent)}
.radar-svg .lab{font-family:var(--f-mono);font-size:11px;fill:var(--ink-2)}
.radar-svg .lab b{font-weight:700;fill:var(--ink)}

/* ========== Page 3 - Summary ========== */
.p-sum{min-height:1000px;display:flex;flex-direction:column}
.sum-head{text-align:center;padding:44px 40px 26px;border-bottom:1px solid var(--line);position:relative;z-index:2}
.sum-head .thumb{width:104px;height:104px;margin:0 auto 16px;border:1px solid var(--line);overflow:hidden;
  background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:6px 6px 0 var(--paper-2)}
.sum-head .thumb img{width:100%;height:100%;object-fit:cover}
.sum-head .a{font:10px var(--f-mono);letter-spacing:5px;text-transform:uppercase;color:var(--ink-3)}
.sum-head .t{font:900 30px/1.25 var(--f-serif);margin-top:4px}
.sum-head .m{font:10px var(--f-mono);letter-spacing:2px;color:var(--ink-3);margin-top:6px}
.sum-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;position:relative;z-index:2}
.sum-cell{padding:26px 32px;border-bottom:1px solid var(--line-soft);animation:riseIn .6s both}
.sum-cell:nth-child(odd){border-right:1px solid var(--line-soft)}
.sum-cell:nth-child(1){animation-delay:.3s}.sum-cell:nth-child(2){animation-delay:.4s}
.sum-cell:nth-child(3){animation-delay:.5s}.sum-cell:nth-child(4){animation-delay:.6s}
.sum-cell:nth-child(5){animation-delay:.7s}
.sum-cell .nm{font:600 14px var(--f-sans)}
.sum-cell .nm span{font:9px var(--f-mono);color:var(--ink-3);letter-spacing:2px;text-transform:uppercase;margin-left:8px}
.sum-cell .sc{font:900 44px/1 var(--f-serif);margin:8px 0 6px}
.sum-cell .sc small{font:12px var(--f-mono);color:var(--ink-3);font-weight:400}
.sum-cell .lv{display:inline-block;font:9px var(--f-mono);letter-spacing:2px;padding:2px 10px;border:1px solid var(--line);color:var(--ink-3)}
.sum-cell.hot .lv{border-color:var(--accent);color:var(--accent)}
.sum-cell .tx{font:italic 13px/1.75 var(--f-serif);color:var(--ink-2);margin-top:10px}
.sum-foot{padding:22px 40px 28px;border-top:2px solid var(--ink);position:relative;z-index:2}
.sum-foot .line1{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sum-foot .heat{font:13px var(--f-mono);color:var(--gold);letter-spacing:2px}
.sum-foot .heat small{font-size:9px;color:var(--ink-3);letter-spacing:2px}
.sum-foot .note{margin-top:12px;font:10px/1.8 var(--f-mono);color:var(--ink-3);letter-spacing:1px;
  border-top:1px dotted var(--line);padding-top:12px}
.sum-foot .sig{display:flex;justify-content:space-between;margin-top:14px;font:9px var(--f-mono);letter-spacing:3px;color:var(--ink-3)}

/* Pager / Toolbar */
.pager{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:6px;background:rgba(20,17,12,.92);
  border:1px solid rgba(243,238,226,.14);border-radius:99px;padding:8px 10px;
  box-shadow:0 16px 40px rgba(0,0,0,.5)}
.pager button{font:11px var(--f-mono);letter-spacing:1px;background:none;border:1px solid rgba(243,238,226,.2);
  color:#f3eee2;border-radius:99px;padding:7px 14px;cursor:pointer;transition:all .2s}
.pager button:hover{border-color:var(--accent);color:#fff;background:rgba(196,30,58,.18)}
.pager .dots{display:flex;gap:7px;padding:0 8px}
.pager .dot{width:7px;height:7px;border-radius:50%;background:rgba(243,238,226,.28);cursor:pointer;transition:all .25s;border:none;padding:0}
.pager .dot.on{background:var(--accent);transform:scale(1.35)}
.pager .sep{width:1px;height:18px;background:rgba(243,238,226,.15);margin:0 4px}
.pager .page-no{font:10px var(--f-mono);color:rgba(243,238,226,.6);letter-spacing:2px;min-width:52px;text-align:center}

/* Export mode: flatten everything for html2canvas */
body.exporting{padding:0}
body.exporting .stage{transform:none!important}
body.exporting .page{display:block!important;animation:none!important;box-shadow:none;margin-bottom:0}
body.exporting .bar-track .fill{transition:none!important}
body.exporting .p-cover .art{animation:none!important}
body.exporting .pager{display:none!important}

@media (max-width:820px){
  body{padding:16px 8px 110px}
  .pager{max-width:94vw;overflow-x:auto}
}
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="pages" id="pages"></div>
  </div>
</div>

<div class="pager" id="pager" data-html2canvas-ignore>
  <button onclick="prevPage()" title="上一页">←</button>
  <div class="dots" id="dots"></div>
  <span class="page-no" id="page-no">1 / 3</span>
  <button onclick="nextPage()" title="下一页">→</button>
  <div class="sep"></div>
  <button onclick="exportCurrent()">导出本页 PNG</button>
  <button onclick="exportAll()">导出全部</button>
</div>

<script>
// ============ Data Loading ============
function getCardData() {
  const urlParams = new URLSearchParams(window.location.search);
  const dataParam = urlParams.get("data");
  const tryParse = (s) => {
    try { return JSON.parse(s); } catch (e) {}
    try { return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch (e) {}
    try { return JSON.parse(atob(s)); } catch (e) {}
    return null;
  };
  if (dataParam) { const d = tryParse(dataParam); if (d) return d; }
  if (window.location.hash && window.location.hash.length > 1) {
    const d = tryParse(window.location.hash.slice(1)); if (d) return d;
  }
  if (window.__CARD_DATA__) return window.__CARD_DATA__;
  return {
    artist: "The Kills", title: "Future Starts Slow", year: "2011", label: "Domino",
    genre: "Garage Rock / Indie Rock", coverUrl: "",
    scores: {
      词: {score:10, rationale:"直白情绪宣泄，重复性强，符合车库摇滚的极简表达，但缺乏叙事深度"},
      曲: {score:14, rationale:"riff驱动的旋律线条简洁有力，副歌记忆点强烈，小调暗色与中快节奏咬合紧密"},
      编: {score:15, rationale:"层次分明，失真吉他与贝斯交替主导，从稀疏到密集的过渡控制精准"},
      唱: {score:14, rationale:"从低吟到嘶吼的张力控制精准，情感传达直接且具有爆发力"},
      混: {score:13, rationale:"保留车库的毛边感，低频控制好但高频偶有刺耳，整体温暖有质感"}
    },
    totalScore: 66,
    oneLiner: "粗粝riff驱动的压抑与爆发",
    tags: ["车库摇滚", "独立", "indie rock"],
    heat: { netease_comments: 2781 },
    note: "评分基于 2026-08-04 听感记录 + Wikipedia 实时数据校准",
  };
}

// ============ Helpers ============
function escapeHTML(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function extractScore(v){ return (typeof v === "number") ? v : (v && typeof v.score === "number" ? v.score : null); }
function extractRationale(v){ return (v && typeof v === "object" && v.rationale) ? v.rationale : ""; }

const dims = ["词","曲","编","唱","混"];
const dimsEn = ["Lyrics","Composition","Arrangement","Performance","Production"];
const maxScore = 20;

function levelOf(v){ return v >= 17 ? "突出" : v >= 14 ? "优秀" : v >= 9 ? "合格" : "短板"; }

function calcHeat(heat) {
  const c = (heat && heat.netease_comments) || 0;
  const stars = c >= 10000 ? 5 : c >= 999 ? 4 : c >= 300 ? 3 : c >= 50 ? 2 : c > 0 ? 1 : 0; // 与 server calcHeatScore 对齐
  return { stars, label: "★".repeat(stars) + "☆".repeat(5 - stars) };
}
function getHeatScore(data) {
  if (data.heatScore && typeof data.heatScore.stars === "number") return data.heatScore;
  return calcHeat(data.heat);
}
function hashHue(str) {
  let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h % 360;
}

// ============ Radar Chart ============
function renderRadar(scoresData, size) {
  const cx = size/2, cy = size/2, r = size*0.36, labelR = r + 34;
  const hasLyrics = scoresData.词 !== null && scoresData.词 !== undefined;
  const useDims = hasLyrics ? dims : dims.filter(d => d !== "词");
  const vals = useDims.map(d => extractScore(scoresData[d]) || 0);
  const step = (2*Math.PI)/useDims.length, start = -Math.PI/2;
  const pt = (i, v) => {
    const a = start + i*step;
    return [cx + r*(v/maxScore)*Math.cos(a), cy + r*(v/maxScore)*Math.sin(a)];
  };

  let grid = "";
  for (let ring = 1; ring <= 4; ring++) {
    const pts = useDims.map((_, i) => pt(i, ring*5).map(n => n.toFixed(1)).join(",")).join(" ");
    grid += `<polygon class="grid" points="${pts}" stroke-width="${ring===4 ? 1 : 0.5}"/>`;
  }
  let axes = "";
  useDims.forEach((_, i) => {
    const [x, y] = pt(i, maxScore);
    axes += `<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke-width="0.5"/>`;
  });
  const polyPts = useDims.map((_, i) => pt(i, vals[i]).map(n => n.toFixed(1)).join(",")).join(" ");
  let dots = "", labels = "";
  useDims.forEach((d, i) => {
    const [x, y] = pt(i, vals[i]);
    dots += `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2"/>`;
    const a = start + i*step;
    const lx = cx + labelR*Math.cos(a), ly = cy + labelR*Math.sin(a);
    labels += `<text class="lab" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central">${d} <tspan font-weight="700" fill="var(--ink)">${vals[i]}</tspan></text>`;
  });

  return `<svg class="radar-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${grid}${axes}
    <polygon class="data-poly" points="${polyPts}"/>
    ${dots}${labels}
  </svg>`;
}

function animateRadar(svgEl) {
  const poly = svgEl.querySelector(".data-poly");
  if (!poly) return;
  let len = 1400;
  try { len = poly.getTotalLength(); } catch (e) {}
  poly.style.transition = "none";
  poly.style.strokeDasharray = len;
  poly.style.strokeDashoffset = len;
  poly.style.fillOpacity = "0";
  requestAnimationFrame(() => {
    poly.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1) .15s, fill-opacity .8s ease .8s";
    poly.style.strokeDashoffset = "0";
    poly.style.fillOpacity = "1";
  });
  svgEl.querySelectorAll(".dot").forEach((d, i) => {
    d.style.transition = "none";
    d.style.opacity = "0";
    requestAnimationFrame(() => {
      d.style.transition = `opacity .4s ease ${0.9 + i*0.08}s`;
      d.style.opacity = "1";
    });
  });
}

// ============ Page Renderers ============
function coverBgStyle(url){ return url ? `style="background-image:url('${escapeHTML(url)}')"` : ""; }
function thumbHTML(data, fallback){
  return data.coverUrl
    ? `<img src="${escapeHTML(data.coverUrl)}" alt="" crossorigin="anonymous" onerror="this.remove()">`
    : (fallback || "🎵");
}
function corners(){ return `<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>`; }

function renderCoverPage(data) {
  const { artist, title, year, label, genre, coverUrl, totalScore, oneLiner, tags, scores } = data;
  const hasLyrics = scores && scores.词 !== null && scores.词 !== undefined;
  const heat = getHeatScore(data);
  const meta = [year, label, genre].filter(Boolean).join(" · ");
  function localDate(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  const dateMatch = (data.note || "").match(/\d{4}-\d{2}-\d{2}/);
  const date = dateMatch ? dateMatch[0] : localDate();

  return `<section class="page p-cover ${coverUrl ? "" : "noart"}" style="--hue:${hashHue((artist||"")+(title||""))}">
    <div class="art" ${coverBgStyle(coverUrl)}></div>
    <div class="shade"></div>
    <div class="inner">
      <div class="cover-top">
        <div class="brand">歌掘士 <b>/</b> SOUND ANATOMY</div>
        <div class="date">REVIEW REPORT<br>${date}</div>
      </div>
      <div class="cover-mid">
        <div class="c-artist">${escapeHTML(artist || "Unknown Artist")}</div>
        <h1 class="c-title">${escapeHTML(title || "Untitled")}</h1>
        ${meta ? `<div class="c-meta">${escapeHTML(meta)}</div>` : ""}
        <div class="c-score-band">
          <div class="c-total">
            <span class="num"><i>${totalScore ?? "—"}</i></span>
            <span class="of">/ ${hasLyrics ? 100 : 80}<span class="lab">TOTAL SCORE 总分</span></span>
          </div>
          ${heat.stars > 0 ? `<div class="c-heat">${heat.label}<small>热度 HEAT</small></div>` : ""}
        </div>
        ${oneLiner ? `<div class="c-oneliner">${escapeHTML(oneLiner)}</div>` : ""}
        ${tags && tags.length ? `<div class="c-tags">${tags.map(t => `<span class="chip">#${escapeHTML(t)}</span>`).join("")}</div>` : ""}
      </div>
    </div>
  </section>`;
}

function renderScorePage(data) {
  const { artist, title, year, label, genre, coverUrl, scores, totalScore, oneLiner, tags, note } = data;
  const hasLyrics = scores.词 !== null && scores.词 !== undefined;
  const heat = getHeatScore(data);
  const meta = [year, label, genre].filter(Boolean).join(" · ");

  const rows = dims.map((d, i) => {
    const raw = scores[d];
    const val = extractScore(raw);
    const why = extractRationale(raw);
    if (val === null) {
      if (d === "词" && !hasLyrics)
        return `<div class="bar-row" style="opacity:.45"><div class="bar-top">
          <div class="bar-dim"><b>词</b><span>${dimsEn[i]}</span></div>
          <div class="bar-track"><div class="fill" data-w="0"></div></div>
          <div class="bar-val">—</div><div class="bar-level">N/A</div></div>
          <div class="bar-why">纯器乐 — 不适用歌词评分</div></div>`;
      return "";
    }
    const pct = (val/maxScore)*100;
    const hot = val >= 17 ? " hot" : "";
    return `<div class="bar-row${hot}"><div class="bar-top">
        <div class="bar-dim"><b>${d}</b><span>${dimsEn[i]}</span></div>
        <div class="bar-track"><div class="fill" data-w="${pct}"></div></div>
        <div class="bar-val">${val}<small>/20</small></div>
        <div class="bar-level">${levelOf(val)}</div>
      </div>
      ${why ? `<div class="bar-why">${escapeHTML(why)}</div>` : ""}</div>`;
  }).join("");

  return `<section class="page p-scores">
    ${coverUrl ? `<div class="cover-bg" ${coverBgStyle(coverUrl)}></div>` : ""}
    <div class="frame-line"></div>${corners()}
    <header class="s-head">
      <div class="thumb">${thumbHTML(data)}</div>
      <div class="who">
        <div class="a">${escapeHTML(artist || "")}</div>
        <div class="t">${escapeHTML(title || "")}</div>
        ${meta ? `<div class="m">${escapeHTML(meta)}</div>` : ""}
      </div>
      <div class="tot"><span class="n">${totalScore}<em>/${hasLyrics?100:80}</em></span><div class="l">TOTAL 总分</div></div>
    </header>
    <div class="s-body">
      <div class="radar-box">${renderRadar(scores, 340)}</div>
      <div class="verdict">
        <div class="vh">听诊结论 / VERDICT</div>
        ${oneLiner ? `<div class="vo">「${escapeHTML(oneLiner)}」</div>` : ""}
        ${tags && tags.length ? `<div class="vt">${tags.map(t => `<span class="chip">#${escapeHTML(t)}</span>`).join("")}</div>` : ""}
        ${heat.stars > 0 ? `<div class="vheat">${heat.label}<small>热度 HEAT · 网易云评论 ${((data.heat||{}).netease_comments||0).toLocaleString()}</small></div>` : ""}
      </div>
    </div>
    <div class="s-bars">${rows}</div>
    <footer class="s-foot">
      <span class="brandmark">歌掘士 · SOUND ANATOMY</span>
      ${note ? `<span class="note">${escapeHTML(note)}</span>` : ""}
    </footer>
  </section>`;
}

function renderSummaryPage(data) {
  const { artist, title, year, scores, oneLiner, note } = data;
  const heat = getHeatScore(data);

  const cells = dims.map((d, i) => {
    const raw = scores[d];
    const val = extractScore(raw);
    const why = extractRationale(raw);
    if (val === null) return "";
    const hot = val >= 17 ? " hot" : "";
    return `<div class="sum-cell${hot}">
      <div class="nm">${d}<span>${dimsEn[i]}</span></div>
      <div class="sc">${val}<small>/20</small></div>
      <div class="lv">${levelOf(val)}</div>
      ${why ? `<div class="tx">${escapeHTML(why)}</div>` : ""}
    </div>`;
  }).join("");

  const headMeta = [year, oneLiner].filter(Boolean).join(" — ");

  return `<section class="page p-sum">
    ${data.coverUrl ? `<div class="cover-bg" ${coverBgStyle(data.coverUrl)}></div>` : ""}
    <div class="frame-line"></div>${corners()}
    <header class="sum-head">
      <div class="thumb">${thumbHTML(data)}</div>
      <div class="a">${escapeHTML(artist || "")}</div>
      <div class="t">${escapeHTML(title || "")}</div>
      ${headMeta ? `<div class="m">${escapeHTML(headMeta)}</div>` : ""}
    </header>
    <div class="sum-grid">${cells}</div>
    <footer class="sum-foot">
      <div class="line1">
        ${heat.stars > 0 ? `<span class="heat">${heat.label} <small>热度 HEAT</small></span>` : "<span></span>"}
        <span class="brandmark">五维解剖 · 词 曲 编 唱 混</span>
      </div>
      ${note ? `<div class="note">${escapeHTML(note)}</div>` : ""}
      <div class="sig"><span>歌掘士 · SOUND ANATOMY</span><span>GENERATED ${localDate()}</span></div>
    </footer>
  </section>`;
}

// ============ Pager & Responsive Fit ============
let currentPage = 0;
let pageEls = [];

function fitStage() {
  const stage = document.getElementById("stage");
  const scale = Math.min(1, (window.innerWidth - 24) / 750);
  stage.style.transform = `scale(${scale})`;
  const active = pageEls[currentPage];
  if (active) stage.style.height = (active.offsetHeight * scale) + "px";
}

function showPage(i) {
  currentPage = Math.max(0, Math.min(pageEls.length - 1, i));
  pageEls.forEach((p, idx) => p.classList.toggle("active", idx === currentPage));
  document.querySelectorAll(".pager .dot").forEach((d, idx) => d.classList.toggle("on", idx === currentPage));
  document.getElementById("page-no").textContent = `${currentPage + 1} / ${pageEls.length}`;

  const active = pageEls[currentPage];
  if (!active) return;
  active.style.animation = "none";
  void active.offsetWidth;
  active.style.animation = "";

  const radar = active.querySelector(".radar-svg");
  if (radar) animateRadar(radar);
  active.querySelectorAll(".bar-track .fill").forEach(f => {
    f.style.transition = "none";
    f.style.width = "0%";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      f.style.transition = "";
      f.style.width = f.dataset.w + "%";
    }));
  });
  fitStage();
}
function nextPage(){ showPage(currentPage + 1); }
function prevPage(){ showPage(currentPage - 1); }

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") nextPage();
  if (e.key === "ArrowLeft") prevPage();
});
let touchX = null;
document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, {passive:true});
document.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) { if (dx < 0) nextPage(); else prevPage(); }
  touchX = null;
}, {passive:true});
window.addEventListener("resize", fitStage);

// ============ Boot ============
function renderAll(data) {
  document.getElementById("pages").innerHTML =
    renderCoverPage(data) + renderScorePage(data) + renderSummaryPage(data);
  pageEls = Array.from(document.querySelectorAll(".page"));
}

try {
  const data = getCardData();
  document.title = `歌掘士 · ${data.artist || ""} — ${data.title || ""}`;
  renderAll(data);
  document.getElementById("dots").innerHTML = pageEls
    .map((_, i) => `<button class="dot${i===0?" on":""}" onclick="showPage(${i})" aria-label="第${i+1}页"></button>`)
    .join("");
  showPage(0);

  // Wikipedia cover fallback when no coverUrl provided
  if (!data.coverUrl && data.artist && data.title) {
    const q = encodeURIComponent(`${data.artist} ${data.title}`);
    fetch(`https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&titles=${q}&format=json&origin=*&piprop=thumbnail&pithumbsize=600`)
      .then(r => r.json()).then(d => {
        const page = Object.values((d && d.query && d.query.pages) || {})[0];
        const src = page && page.thumbnail && page.thumbnail.source;
        if (!src) return;
        data.coverUrl = src;
        renderAll(data);
        showPage(currentPage);
      }).catch(() => {});
  }
} catch (err) {
  document.getElementById("pages").innerHTML =
    `<div style="padding:60px;color:#c41e3a;font:13px monospace">渲染错误: ${escapeHTML(err.message)}</div>`;
}

// ============ Export (html2canvas) ============
async function loadH2C() {
  const mod = await import("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.esm.js");
  return mod.default;
}
function download(canvas, name) {
  const a = document.createElement("a");
  a.download = name;
  a.href = canvas.toDataURL("image/png");
  a.click();
}
async function withExportMode(fn) {
  document.body.classList.add("exporting");
  try { return await fn(); }
  finally {
    document.body.classList.remove("exporting");
    showPage(currentPage);
  }
}
async function exportCurrent() {
  const html2canvas = await loadH2C();
  await withExportMode(async () => {
    const el = pageEls[currentPage];
    el.querySelectorAll(".bar-track .fill").forEach(f => { f.style.width = f.dataset.w + "%"; });
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: currentPage === 0 ? "#1c1813" : "#faf7f1", useCORS: true, logging: false });
    download(canvas, `scorecard-p${currentPage+1}-${Date.now()}.png`);
  });
}
async function exportAll() {
  const html2canvas = await loadH2C();
  await withExportMode(async () => {
    for (let i = 0; i < pageEls.length; i++) {
      const el = pageEls[i];
      el.querySelectorAll(".bar-track .fill").forEach(f => { f.style.width = f.dataset.w + "%"; });
      const canvas = await html2canvas(el, { scale: 2, backgroundColor: i === 0 ? "#1c1813" : "#faf7f1", useCORS: true, logging: false });
      download(canvas, `scorecard-p${i+1}-${Date.now()}.png`);
      await new Promise(r => setTimeout(r, 400));
    }
  });
  alert(`已导出 ${pageEls.length} 页 PNG`);
}
</script>
